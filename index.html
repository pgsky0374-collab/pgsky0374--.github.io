let provider, signer, userAddr, mainContract, divContract;
let lockDay = 7;

// 连接钱包 —— 完全不变
document.getElementById('connectBtn').onclick = async () => {
  if (!window.ethereum) {
    alert('请在 TokenPocket 钱包内打开');
    return;
  }
  try {
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();
    userAddr = await signer.getAddress();
    document.getElementById('connectBtn').innerText = '已连接';

    mainContract = new ethers.Contract(CONFIG.mainAddr, CONFIG.mainABI, signer);
    divContract = new ethers.Contract(CONFIG.divAddr, CONFIG.divABI, signer);
    loadAllData();

    // 只加这一句：连接钱包后自动生成收款码
    makeQrcode();
  } catch (e) {
    alert('连接钱包失败：' + e.message);
  }
};

  if (!userAddr) return;

    const level = await mainContract.level(userAddr);

    document.getElementById('userWeight').innerText = stakeInfo.weight.toString();

    const pending = await divContract.pendingDividend(userAddr);
    document.getElementById('pendingDiv').innerText = ethers.utils.formatEther(pending) + ' USDT';
    document.getElementById('unclaim').innerText = ethers.utils.formatEther(pending) + ' USDT';

    const claimed = await divContract.userClaimed(userAddr);

    const totalPool = await divContract.totalDividendUSDT();

    const ref = await mainContract.referrer(userAddr);

    const teamSize = await mainContract.teamSize(userAddr);
    document.getElementById('teamCount').innerText = teamSize.toString();

    const teamStake = await mainContract.teamStake(userAddr);
    document.getElementById('teamStake').innerText = ethers.utils.formatEther(teamStake) + ' FCB';
  } catch (e) { console.log("加载数据出错", e); }
}

function makeQrcode() {

  const coin = document.getElementById('payCoin').value;
  const amt = document.getElementById('receiveAmt').value;
  if (!amt || amt <= 0) {

  });
}

});

// =====================================================================
// 扫码付款 —— 完全不变
// =====================================================================
let video, canvas, ctx, scanOverlay;

document.getElementById('scanPayBtn').onclick = async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('设备不支持相机');
    return;
  }
  video = document.createElement('video');
  canvas = document.createElement('canvas');
  ctx = canvas.getContext('2d');
  video.style.position = 'fixed';
  video.style.top = '0';
  video.style.left = '0';
  video.style.width = '100%';
  video.style.height = '100%';
  video.style.objectFit = 'cover';
  video.style.zIndex = '9999';

  scanOverlay = document.createElement('div');
  scanOverlay.style.position = 'fixed';
  scanOverlay.style.top = '50%';
  scanOverlay.style.left = '50%';
  scanOverlay.style.transform = 'translate(-50%, -50%)';
  scanOverlay.style.width = '260px';
  scanOverlay.style.height = '260px';
  scanOverlay.style.border = '3px solid #6366f1';
  scanOverlay.style.borderRadius = '16px';
  scanOverlay.style.zIndex = '10000';

  const closeBtn = document.createElement('button');
  closeBtn.innerText = '关闭';
  closeBtn.style.position = 'fixed';
  closeBtn.style.bottom = '60px';
  closeBtn.style.left = '50%';
  closeBtn.style.transform = 'translateX(-50%)';
  closeBtn.style.padding = '12px 30px';
  closeBtn.style.background = '#6366f1';
  closeBtn.style.color = '#fff';
  closeBtn.style.border = 'none';
  closeBtn.style.borderRadius = '10px';
  closeBtn.style.zIndex = '10000';
  closeBtn.onclick = stopScan;

  document.body.appendChild(video);
  document.body.appendChild(scanOverlay);
  document.body.appendChild(closeBtn);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    await video.play();
    scanLoop();
  } catch (e) {
    alert('相机打开失败，请允许相机权限');
    stopScan();
  }
};

function scanLoop() {
  if (!video || !canvas) return;
  if (video.videoWidth < 10) { requestAnimationFrame(scanLoop); return; }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(imageData.data, imageData.width, imageData.height);
  if (code && code.data) {
    handleScanResult(code.data);
    stopScan();
    return;
  }
  requestAnimationFrame(scanLoop);
}

function stopScan() {
  if (video && video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  if (video) video.remove();
  if (scanOverlay) scanOverlay.remove();
  document.querySelector('button[style*="bottom: 60px"]')?.remove();
  video = null; canvas = null; ctx = null; scanOverlay = null;
}

document.getElementById('galleryScanBtn').onclick = () => {
  document.getElementById('galleryInput').click();
};

document.getElementById('galleryInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      const cvs = document.createElement('canvas');
      const c = cvs.getContext('2d');
      cvs.width = img.width; cvs.height = img.height;
      c.drawImage(img,0,0);
      const idata = c.getImageData(0,0,cvs.width,cvs.height);
      const code = jsQR(idata.data, cvs.width, cvs.height);
      if (code && code.data) {
        handleScanResult(code.data);
      } else {
        alert('未识别到二维码');
      }
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
};

function handleScanResult(codeStr) {
  try {
    const arr = codeStr.split('|');
    if (arr.length !== 3) {
      alert('无效的收款码');
      return;
    }
    const toAddr = arr[0];
    const coin = arr[1];
    const amountStr = arr[2];

    if (!ethers.utils.isAddress(toAddr) || !coin || !amountStr) {
      alert('收款码信息错误');
      return;
    }

    if (confirm(`确认支付：${amountStr} ${coin}？`)) {
      doPay(toAddr, coin, amountStr);
    }
  } catch (e) {
    alert('扫码解析失败');
  }
}

async function doPay(toAddr, coin, amountStr) {
  try {
    if (coin === 'FCB') {
      const amount = ethers.utils.parseEther(amountStr);
      const tx = await mainContract.transfer(toAddr, amount);
      await tx.wait();
      alert('FCB 支付成功！');
    } else if (coin === 'USDT') {
      const usdtContract = new ethers.Contract(CONFIG.USDT, [
        "function transfer(address to, uint amount) returns (bool)"
      ], signer);
      const amount = ethers.utils.parseUnits(amountStr, 6);
      const tx = await usdtContract.transfer(toAddr, amount);
      await tx.wait();
      alert('USDT 支付成功！');
    }
    loadAllData();
  } catch (e) {
    alert('支付失败：' + e.message);
  }
}

setInterval(loadAllData, 10000);
